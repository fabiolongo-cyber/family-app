name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Compila l'app web
        run: npm run build

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Aggiungi i permessi Android (biometria e microfono)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for p in USE_BIOMETRIC RECORD_AUDIO; do
            grep -q "android.permission.$p" "$f" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" "$f"
          done
          grep -n "uses-permission" "$f"

      - name: Genera le icone (se esiste la cartella assets)
        continue-on-error: true
        run: |
          if [ -f assets/icon.png ] || [ -f assets/icon-only.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FFFFFF'
          else
            echo "Nessuna icona personalizzata in assets/: uso quella predefinita."
          fi

      - name: Sincronizza l'app web nel progetto Android
        run: npx cap sync android

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rinomina l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FamilyApp-debug.apk

      - name: Pubblica l'APK nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FamilyApp-debug.apk \
            --title "FamilyApp build ${{ github.run_number }}" \
            --notes "APK di test (debug). Compilato dal commit ${{ github.sha }}."
